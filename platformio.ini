[platformio]
default_envs = esp32_firebase

[env:esp32_firebase]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM5
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/Adafruit BMP280 Library
build_src_filter =
    +<main.cpp>
    +<mpu6050.cpp>
    +<bmp280.cpp>
    +<firebase.cpp>
